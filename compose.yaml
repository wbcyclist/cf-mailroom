services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: mailroom
      POSTGRES_PASSWORD: mailroom_local
      POSTGRES_DB: mailroom
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailroom -d mailroom"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
